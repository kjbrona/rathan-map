<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RosalitaRP Explorer</title>

  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dialogs.css" />
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <section class="sidebar-panel sidebar-header">
        <img
          class="app-logo"
          src="images/RosalitaExplorer_icon.png"
          alt="RosalitaRP Explorer logo"
        />
        <div>
          <h1 id="app-title"></h1>
          <div class="subtitle" id="app-subtitle"></div>
        </div>
      </section>

      <section class="sidebar-panel sidebar-tools">
        <label class="search-control">
          <span>Search</span>
          <input type="search" id="marker-search" placeholder="Search markers..." />
        </label>
        <div id="search-results" class="search-results hidden">
          <div class="search-results-summary" id="search-results-summary">
            0 matching markers
          </div>
          <div id="search-results-list"></div>
        </div>

        <button id="add-marker-btn" type="button">+ Add Marker</button>
        <div class="marker-backup-actions">
          <button id="export-markers-btn" type="button">Export Markers</button>
          <button id="import-markers-btn" type="button">Import Markers</button>
          <input
            type="file"
            id="import-markers-file"
            accept="application/json,.json"
            class="hidden-file-input"
          />
        </div>
      </section>

      <section class="sidebar-panel" id="marker-details-section">
        <h2>Selected Marker</h2>

        <div id="marker-details-empty">
          No marker selected.
        </div>

        <form id="marker-details-form" class="hidden">
          <label>
            Name
            <input type="text" id="edit-marker-name" required />
          </label>

          <label>
            Category
            <select id="edit-marker-category" required></select>
          </label>

          <label>
            Type
            <select id="edit-marker-type" required></select>
          </label>
          <div id="edit-marker-template-fields" class="template-fields"></div>

          <div class="dialog-coordinates">
            X: <span id="edit-marker-x-display">0</span> |
            Y: <span id="edit-marker-y-display">0</span>
          </div>

          <div class="marker-detail-actions">
            <button type="button" id="edit-marker-move">Move Marker</button>
            <button type="button" id="edit-marker-cancel-move" class="hidden">
              Cancel Move
            </button>
            <button type="submit" id="edit-marker-save">Save</button>
            <button type="button" id="edit-marker-delete">Delete</button>
          </div>
        </form>
      </section>

      <section class="sidebar-panel sidebar-filter-panel">
        <h2>Filters</h2>
        <div id="category-list">Loading...</div>
      </section>

      <section class="sidebar-panel" id="marker-stats-section">
        <h2>Statistics</h2>

        <div class="marker-stat-row">
          <span>Total Markers</span>
          <strong id="marker-count-total">0</strong>
        </div>
        <div class="marker-stat-row">
          <span>Currently Visible</span>
          <strong id="marker-count-visible">0</strong>
        </div>
      </section>

      <div class="sidebar-panel sidebar-footer">
        <div>Version <span id="app-version"></span></div>
        <div>Creator: <span id="app-creator"></span></div>
        <div>
          Data Source:
          <strong id="data-source-status">Local Browser Storage</strong>
        </div>
        <div>Autosave: <span id="autosave-status" data-status="saved">Saved</span></div>
      </div>
    </aside>

    <main id="map"></main>
  </div>

  <div id="marker-dialog" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add Marker</h2>
        <button id="marker-dialog-close">×</button>
      </div>

      <form id="marker-form">
        <input type="hidden" id="marker-x" />
        <input type="hidden" id="marker-y" />

        <label>
          Name
          <input type="text" id="marker-name" required />
        </label>

        <label>
          Category
          <select id="marker-category" required></select>
        </label>

        <label>
          Type
          <select id="marker-type" required></select>
        </label>

        <div id="marker-template-fields" class="template-fields"></div>

        <div class="dialog-coordinates">
          X: <span id="marker-x-display">0</span> |
          Y: <span id="marker-y-display">0</span>
        </div>

        <div class="modal-actions">
          <button type="button" id="marker-cancel">Cancel</button>
          <button type="submit" id="marker-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="import-mode-dialog" class="modal hidden">
    <div class="modal-content import-mode-content">
      <div class="modal-header">
        <h2>Import Mode</h2>
        <button id="import-mode-close">×</button>
      </div>

      <form id="import-mode-form">
        <label class="import-mode-option">
          <input
            type="radio"
            name="import-mode"
            value="replace"
            checked
          />
          <span>
            <strong>Replace Existing Markers</strong>
            <small>Deletes current markers before importing.</small>
          </span>
        </label>

        <label class="import-mode-option">
          <input type="radio" name="import-mode" value="merge" />
          <span>
            <strong>Merge With Existing Markers</strong>
            <small>Imports only markers whose UUID is not already present.</small>
          </span>
        </label>

        <div class="modal-actions">
          <button type="button" id="import-mode-cancel">Cancel</button>
          <button type="submit" id="import-mode-continue">Import</button>
        </div>
      </form>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/firebaseConfig.js"></script>
  <script src="js/firebaseStorage.js"></script>
  <script src="js/map.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/types.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/markers.js"></script>
  <script src="js/markerManager.js"></script>
  <script src="js/search.js"></script>
  <script src="js/contextMenu.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
